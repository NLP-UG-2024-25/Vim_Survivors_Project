<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Movie Finder</title>
    <!-- Podłączenie do pliku css -->
    <link rel="stylesheet" href="styles.css">
    <!-- Wskazanie faviconu -->
    <link rel="icon" href="popcorn.ico" type="image/x-icon">
</head>

<body>
  <!-- Ukryty checkbox do przełączania ciemny/jasny  -->
  <input type="checkbox" id="themeToggle" hidden>

  <div class="app">
    <!-- Nagłówek strony -->
    <header class="header">
        <div class="container header-row">
  <div class="header-left">
    <!-- Logo i podtytuł -->
    <h1 class="logo">🎬 MovieFinder</h1>
    <p class="subtitle">Search movies by multiple parameters</p>
  </div>
  <!-- Przycisk do zmiany motywu -->
  <label for="themeToggle" class="theme-icon-toggle">
    <span class="icon"></span>
  </label>
</div>

    </header>

    <!-- Główna zawartość strony -->
    <main class="container">
      <!-- Sekcja z nagłówkiem wyszukiwania filmów -->
<section class="section" id="search">
    <h2>Search movies</h2>
    <p class="muted">
      Choose your preferences. Results will appear below.
    </p>
      <!-- Formularz wyszukiwania -->
    <form class="search-form">
      <div class="field">
        <label>Title</label>
        <input type="text" placeholder="e.g. Inception">
      </div>

      <div class="field">
        <label>Year</label>
        <input type="number" placeholder="e.g. 2014">
      </div>

      <div class="field">
        <label>Director</label>
        <input type="text" placeholder="e.g. Nolan">
      </div>

      <div class="field">
        <label>Cast</label>
        <input type="text" placeholder="e.g. DiCaprio">
      </div>

      <div class="field">
        <label>Genre</label>
        <select>
          <option>Any</option>
          <option>Action</option>
          <option>Drama</option>
          <option>Comedy</option>
          <option>Sci-Fi</option>
        </select>
      </div>

      <div class="field">
        <label>Runtime</label>
        <select>
          <option>Any</option>
          <option>&lt; 90 min</option>
          <option>90–120 min</option>
          <option>120+ min</option>
        </select>
      </div>

      <div class="field">
        <label>Awards</label>
        <select>
          <option>Any</option>
          <option>Oscar winner</option>
          <option>Oscar nominated</option>
          <option>Golden Globe winner</option>
        </select>
      </div>

      <div class="field">
        <label>Country</label>
        <select>
          <option>Any</option>
          <option>USA</option>
          <option>UK</option>
          <option>France</option>
          <option>Poland</option>
          <option>Japan</option>
        </select>
      </div>
        <!-- Przyciski wyszukiwania i resetowania -->
      <div class="actions">
        <button class="btn btn-primary" type="submit">Search</button>
        <button class="btn btn-ghost" type="reset">Reset</button>
      </div>
    </form>
  </section>
    <!-- Sekcja wyników -->
  <section class="section" id="results"> 
    <h2>Results</h2>
    <!-- Pusty placeholder dla wyników -->
    <div class="results-empty">
      <p>
        No results yet.<br>
        Use the search form above to find movies.
      </p>
    </div></section>
  
    </main>
    <!-- Stopka strony -->
    <footer class="footer">
        <p>
            HTML + CSS Project • Movie data provided by
            <a href="https://www.omdbapi.com/" target="_blank">OMDb API</a>
        </p>
    </footer>
  </div>
</body>

</html>
